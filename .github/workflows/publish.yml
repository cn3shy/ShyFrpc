name: Publish to Modrinth & CurseForge

on:
  workflow_dispatch:
    inputs:
      channel_override:
        type: choice
        description: '发布类型（auto = 按 mod_version 末位自动判定：0→beta，1→release）'
        default: auto
        options:
          - auto
          - alpha
          - beta
          - release

env:
  java-version: "25"

  # 仓库变量（Settings → Secrets and variables → Actions → Variables）：
  #   MODRINTH_ID      Modrinth 项目 ID（项目页 URL 里的那段 slug）
  #   CURSEFORGE_ID    CurseForge 项目 ID（项目页 URL 末尾的数字）
  # 未配置时对应平台会因 ID 为空而报错，属于预期行为。
  modrinth-id: ${{ vars.MODRINTH_ID }}
  curseforge-id: ${{ vars.CURSEFORGE_ID }}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Set up JDK ${{ env.java-version }}
        uses: actions/setup-java@v5
        with:
          java-version: ${{ env.java-version }}
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false
          cache-cleanup: always

      - name: Make Gradle Wrapper Executable
        if: ${{ runner.os != 'Windows' }}
        run: chmod +x ./gradlew

      - name: Build with Gradle Wrapper
        run: ./gradlew build

      # 版本号格式为 <年月>.<本月发布次数>-<类型>，如 2610.2-beta / 2610.2-release。
      # 用连字符限定符是 Maven 的原生约定：beta/alpha 是已知限定符，
      # release 是等价于正式版的别名，Forge/NeoForge 解析 mods.toml 时都能正确处理。
      # 发布类型从后缀推导，而不是让发布者再手选一次——两处独立的话迟早会对不上。
      - name: Resolve Version and Channel
        run: |
          VERSION=$(grep '^mod_version' gradle.properties | cut -d'=' -f2 | tr -d ' \r')

          case "$VERSION" in
            *-release) DERIVED=release ;;
            *-beta)    DERIVED=beta ;;
            *-alpha)   DERIVED=alpha ;;
            *)
              echo "::error::mod_version '$VERSION' 缺少发布类型后缀，应为 <年月>.<次数>-beta / -release / -alpha"
              exit 1
              ;;
          esac

          if [ "${{ inputs.channel_override }}" = "auto" ]; then
            CHANNEL="$DERIVED"
          else
            CHANNEL="${{ inputs.channel_override }}"
            echo "::warning::手动把发布类型从 $DERIVED 覆盖成了 $CHANNEL，与版本号 $VERSION 不一致"
          fi

          echo "MOD_VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "CHANNEL=${CHANNEL}" >> "$GITHUB_ENV"
          echo "版本号 ${VERSION}（末位 ${TYPE}） -> 发布类型 ${CHANNEL}"

      - name: Publish (Fabric)
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          fail-mode: warn
          modrinth-id: ${{ env.modrinth-id }}
          modrinth-token: "${{ secrets.MODRINTH_TOKEN }}"
          curseforge-id: ${{ env.curseforge-id }}
          curseforge-token: "${{ secrets.CURSEFORGE_TOKEN }}"

          name: "ShyFrpc Fabric ${{ env.MOD_VERSION }}"
          version-type: ${{ env.CHANNEL }}
          loaders: fabric
          files: fabric/build/libs/!(*-@(dev|sources|javadoc)).jar
          java: Java ${{ env.java-version }}

      - name: Publish (Forge)
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          fail-mode: warn
          modrinth-id: ${{ env.modrinth-id }}
          modrinth-token: "${{ secrets.MODRINTH_TOKEN }}"
          curseforge-id: ${{ env.curseforge-id }}
          curseforge-token: "${{ secrets.CURSEFORGE_TOKEN }}"

          name: "ShyFrpc Forge ${{ env.MOD_VERSION }}"
          version-type: ${{ env.CHANNEL }}
          loaders: forge
          files: forge/build/libs/!(*-@(dev|sources|javadoc)).jar
          java: Java ${{ env.java-version }}

      - name: Publish (NeoForge)
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          fail-mode: warn
          modrinth-id: ${{ env.modrinth-id }}
          modrinth-token: "${{ secrets.MODRINTH_TOKEN }}"
          curseforge-id: ${{ env.curseforge-id }}
          curseforge-token: "${{ secrets.CURSEFORGE_TOKEN }}"

          name: "ShyFrpc NeoForge ${{ env.MOD_VERSION }}"
          version-type: ${{ env.CHANNEL }}
          loaders: neoforge
          files: neoforge/build/libs/!(*-@(dev|sources|javadoc)).jar
          java: Java ${{ env.java-version }}
