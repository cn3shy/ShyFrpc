name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false
          cache-cleanup: always

      - name: Make Gradle Wrapper Executable
        if: ${{ runner.os != 'Windows' }}
        run: chmod +x ./gradlew

      - name: Build with Gradle Wrapper
        run: ./gradlew build

      # 版本号末位为类型段：0 = beta，1 = release。beta 在 GitHub 上标记为 Pre-release。
      - name: Resolve Version
        run: |
          VERSION=$(grep '^mod_version' gradle.properties | cut -d'=' -f2 | tr -d ' \r')
          TYPE="${VERSION##*.}"

          case "$TYPE" in
            1) PRERELEASE=false ;;
            0) PRERELEASE=true ;;
            *)
              echo "::error::mod_version 的末位类型段是 '$TYPE'，只允许 0（beta）或 1（release）"
              exit 1
              ;;
          esac

          echo "MOD_VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "PRERELEASE=${PRERELEASE}" >> "$GITHUB_ENV"
          echo "版本号 ${VERSION}（末位 ${TYPE}） -> prerelease=${PRERELEASE}"

      - name: Collect Jars
        run: |
          mkdir -p release-jars
          for loader in fabric forge neoforge; do
            cp "$loader"/build/libs/*.jar release-jars/
          done
          rm -f release-jars/*-sources.jar release-jars/*-javadoc.jar
          ls -la release-jars/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-jars/*.jar
          generate_release_notes: true
          draft: false
          prerelease: ${{ env.PRERELEASE }}
