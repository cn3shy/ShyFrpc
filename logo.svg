<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512"
     role="img" aria-label="ShyFrpc">
  <title>ShyFrpc</title>

  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#161b26"/>
      <stop offset="1" stop-color="#0a0d13"/>
    </linearGradient>

    <linearGradient id="block" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#77849f"/>
      <stop offset="1" stop-color="#4b5670"/>
    </linearGradient>

    <linearGradient id="portal" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#cdfbff"/>
      <stop offset="0.5" stop-color="#3ed3f5"/>
      <stop offset="1" stop-color="#1287bd"/>
    </linearGradient>

    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#bdf8ff"/>
      <stop offset="0.5" stop-color="#4ad9c0"/>
      <stop offset="1" stop-color="#6ecb50"/>
    </linearGradient>

    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#4fe3ff" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#4fe3ff" stop-opacity="0"/>
    </radialGradient>

    <filter id="blur20" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="20"/>
    </filter>

    <filter id="blur5" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
  </defs>

  <!-- 底板 -->
  <rect width="512" height="512" rx="112" fill="url(#tile)"/>

  <!-- 隧道光晕 -->
  <ellipse cx="256" cy="256" rx="180" ry="150" fill="url(#halo)"/>

  <!-- 方块围成的「门」，右侧留口 -->
  <g>
    <rect x="90"  y="90"  width="100" height="100" rx="20" fill="url(#block)"/>
    <rect x="206" y="90"  width="100" height="100" rx="20" fill="url(#block)"/>
    <rect x="322" y="90"  width="100" height="100" rx="20" fill="url(#block)"/>
    <rect x="90"  y="206" width="100" height="100" rx="20" fill="url(#block)"/>
    <rect x="90"  y="322" width="100" height="100" rx="20" fill="url(#block)"/>
    <rect x="206" y="322" width="100" height="100" rx="20" fill="url(#block)"/>
    <rect x="322" y="322" width="100" height="100" rx="20" fill="url(#block)"/>

    <g fill="none" stroke="#ffffff" stroke-opacity="0.16" stroke-width="2.5">
      <rect x="90"  y="90"  width="100" height="100" rx="20"/>
      <rect x="206" y="90"  width="100" height="100" rx="20"/>
      <rect x="322" y="90"  width="100" height="100" rx="20"/>
      <rect x="90"  y="206" width="100" height="100" rx="20"/>
      <rect x="90"  y="322" width="100" height="100" rx="20"/>
      <rect x="206" y="322" width="100" height="100" rx="20"/>
      <rect x="322" y="322" width="100" height="100" rx="20"/>
    </g>
  </g>

  <!-- 门内的隧道口 -->
  <rect x="206" y="206" width="100" height="100" rx="20" fill="url(#portal)"
        filter="url(#blur20)" opacity="0.85"/>
  <rect x="206" y="206" width="100" height="100" rx="20" fill="url(#portal)"/>
  <rect x="232" y="232" width="48" height="48" rx="10" fill="#f0feff"/>

  <!-- 冲出去的箭头 -->
  <g filter="url(#blur5)" opacity="0.5">
    <rect x="286" y="243" width="114" height="26" fill="url(#beam)"/>
    <path d="M394 228 L436 256 L394 284 Z" fill="#6ecb50"/>
  </g>
  <rect x="286" y="243" width="114" height="26" fill="url(#beam)"/>
  <path d="M394 228 L436 256 L394 284 Z" fill="#6ecb50"/>
</svg>
