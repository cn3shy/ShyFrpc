description='''
启动本机 frpc 进程，把局域网房间通过 FRP 隧道暴露到公网。
'''

[[dependencies.shyfrpc]]
  modId="neoforge"
  type="required"
  versionRange="${neo_version_range}"
  ordering="NONE"
  side="CLIENT"

[[dependencies.shyfrpc]]
  modId="minecraft"
  type="required"
  versionRange="[${minecraft_version_min}, ${minecraft_version_max})"
  ordering="NONE"
  side="CLIENT"
