modLoader="javafml"
loaderVersion="${neo_loader_version_range}"
license="Apache-2.0"
issueTrackerURL="https://github.com/cn3shy/ShyFrpc/issues"

[[mods]]
modId="shyfrpc"
version="${mod_version}"
displayName="${mod_name}"
